name: Schedule probe

# Temporary: checks whether GitHub starts scheduled runs on this account at all. Delete when done.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Scheduled run started at $(date -u +%H:%M:%S) UTC"
